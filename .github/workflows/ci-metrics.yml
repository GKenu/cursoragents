name: ci-metrics
on: [push, pull_request]
permissions:
  contents: write
jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install deps
        run: npm ci || npm i
      - name: Tests (with coverage if configured)
        run: npm test -- --coverage || true
      - name: Collect & commit metrics
        run: |
          export START_MS=$(date +%s%3N)
          node scripts/collect-metrics.mjs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add METRICS.md metrics.json || true
          git commit -m "chore(ci): update metrics [skip ci]" || echo "no changes"
          git push || true
